[package]
name = "gbr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared core engine for Git Backup Restore (GUI + CLI)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
zstd = "0.13"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
fs2 = "0.4"
dirs = "6"
url = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
