name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast signal on every push: format, lint, tests, UI build.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: UI type-check + build
        working-directory: ui
        run: |
          npm ci
          npm run build

  # Terminal CLI binaries for all three platforms.
  cli:
    name: CLI (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release CLI
        run: cargo build --release -p gbr-cli

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/gitbackup --version
          ./target/release/gitbackup --help > /dev/null

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="gitbackup-${GITHUB_SHA::7}-${{ runner.os }}"
          mkdir -p "$stage"
          cp target/release/gitbackup "$stage/"
          cp README.md CLI.md LICENSE* "$stage/" 2>/dev/null || cp README.md CLI.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "gitbackup-${env:GITHUB_SHA::7}-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/gitbackup.exe $stage/
          Copy-Item README.md, CLI.md $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: gitbackup-cli-${{ matrix.os }}
          path: |
            gitbackup-*.tar.gz
            gitbackup-*.zip
          if-no-files-found: error

  # Desktop installers: MSI/NSIS (Windows), DMG (macOS), AppImage/deb/rpm (Linux).
  app:
    name: app (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build desktop app
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: gbr-app-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # Publish a GitHub release with every artifact when a v* tag is pushed.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Git Backup Restore ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
