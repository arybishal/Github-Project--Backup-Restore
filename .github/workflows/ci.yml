name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------- Rust: fmt, clippy, tests (all three OSes) ----------
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install Node (for the UI type check)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: UI type check + build
        run: |
          npm ci
          npm --prefix ui ci
          npm run build:ui

  # ---------- CLI release binaries (per OS) ----------
  cli:
    name: cli (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  asset: gitbackup-linux-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,     asset: gitbackup-macos-aarch64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      asset: gitbackup-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   asset: gitbackup-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p gbr-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/gitbackup"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN" "${{ matrix.asset }}"
          else
            cp "$BIN" "${{ matrix.asset }}"
            tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # ---------- Desktop app bundles (per OS) ----------
  app:
    name: app (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # UI deps are installed first so Tauri's beforeBuildCommand
      # (`npm --prefix ui run build`) works with cwd = repo root.
      - name: Install JS dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build Tauri bundle
        run: npx tauri build

      - name: List bundles
        shell: bash
        run: find target/release/bundle -maxdepth 3 -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error

  # ---------- Publish a GitHub Release with all artifacts ----------
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifact tree
        run: find artifacts -type f | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Create the release if it does not exist yet (it may already have
          # been created manually with notes before the tag was pushed).
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Git Backup Restore $TAG" \
              --generate-notes
          fi

          # Upload every artifact; --clobber makes re-runs idempotent.
          gh release upload "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
